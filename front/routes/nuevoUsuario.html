<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/main.css">
    <title>Nuevo usuario · SIN FOTO NO HAY CASA</title>
</head>

<body>
    <header class="navbar">
        <div class="navbar-inner">
            <a class="brand" href="../index.html">
                <span class="brand-name">SIN FOTO NO HAY CASA</span>
            </a>
            <ul class="nav">
                <li><a href="usuarios.html">USUARIOS</a></li>
                <li><a href="viviendas.html">VIVIENDAS</a></li>
            </ul>
        </div>
    </header>

    <main class="page">
        <div class="card form-card">
            <h2 class="card-title">Crear usuario</h2>
            <p class="card-subtitle muted">Completa los datos y guarda el usuario.</p>

            <div id="formAlert" class="alert" style="display:none;"></div>

            <form id="nuevoUsuarioForm" class="form" autocomplete="off">
                <div class="field">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" name="nombre" type="text" placeholder="Ej. Ana" required />
                </div>

                <div class="field">
                    <label for="apellidos">Apellidos</label>
                    <input id="apellidos" name="apellidos" type="text" placeholder="Ej. Pérez López" required />
                </div>

                <div class="field">
                    <label for="username">Usuario</label>
                    <input id="username" name="username" type="text" placeholder="Ej. anaperez" required />
                    <p class="help">Se usa para identificar al usuario en el listado.</p>
                </div>

                <div class="field">
                    <label for="nif">NIF</label>
                    <input id="nif" name="nif" type="text" placeholder="12345678Z" minlength="9" maxlength="9"
                        required />
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" placeholder="ana@correo.com" required />
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <input id="password" name="password" type="password" placeholder="••••••••" minlength="4"
                        required />
                </div>

                <div class="field">
                    <label for="profile">Perfil</label>
                    <select id="profile" name="profile" required>
                        <option value="USER" selected>USER</option>
                        <option value="ADMIN">ADMIN</option>
                        <option value="GUEST">GUEST</option>
                    </select>
                </div>

                <div class="field">
                    <label for="viviendaId">Vivienda (disponibles)</label>
                    <select id="viviendaId" name="viviendaId">
                        <option value="" selected>Sin vivienda asignada</option>
                    </select>
                    <p class="help">Solo se muestran viviendas marcadas como disponibles.</p>
                </div>

                <div class="actions">
                    <button class="btn btn-primary" type="submit">Guardar usuario</button>
                    <a class="btn" href="usuarios.html">Cancelar</a>
                </div>
            </form>
        </div>
        <script type="module" src="../js/nuevoUsuario.js"></script>
    </main>
</body>

</html>
