<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/main.css">
    <title>Nueva vivienda · SIN FOTO NO HAY CASA</title>
</head>

<body>
    <header class="navbar">
        <div class="navbar-inner">
            <a class="brand" href="../index.html">
                <span class="brand-name">SIN FOTO NO HAY CASA</span>
            </a>
            <ul class="nav">
                <li><a href="usuarios.html">USUARIOS</a></li>
                <li><a href="viviendas.html">VIVIENDAS</a></li>
            </ul>
        </div>
    </header>

    <main class="page">
        <div class="card form-card">
            <h2 class="card-title">Crear vivienda</h2>
            <p class="card-subtitle muted">Introduce los datos del inmueble y guarda.</p>

            <div id="formAlert" class="alert" style="display:none;"></div>

            <form id="nuevaCasaForm" class="form" autocomplete="off">
                <div class="field">
                    <label for="direccion">Dirección</label>
                    <input id="direccion" name="direccion" type="text" placeholder="Ej. Calle Mayor 12, 3ºB" required />
                </div>

                <div class="field">
                    <label for="precio">Precio (€ / mes)</label>
                    <input id="precio" name="precio" type="number" min="0" step="0.01" placeholder="950" required />
                </div>

                <div class="field">
                    <label for="numeroHabitaciones">Número de habitaciones</label>
                    <input id="numeroHabitaciones" name="numeroHabitaciones" type="number" min="0" step="1"
                        placeholder="2" required />
                </div>

                <div class="field">
                    <label for="disponible">Estado</label>
                    <select id="disponible" name="disponible" required>
                        <option value="true" selected>Disponible</option>
                        <option value="false">Alquilada</option>
                    </select>
                </div>

                <div class="actions">
                    <button class="btn btn-primary" type="submit">Guardar vivienda</button>
                    <a class="btn" href="viviendas.html">Cancelar</a>
                </div>
            </form>
        </div>

        <script type="module" src="../js/nuevaCasa.js"></script>
    </main>
</body>

</html>
